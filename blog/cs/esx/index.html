율적으로** 돌리면서도 **서로 완전히 격리**하고, 심지어 **과다할당(overcommit)** 상황(총 VM “물리” 메모리 합 \u003e 실제 RAM)도 안전하게 운영하기\n* **제약**: 게스트 OS는 **수정할 수 없음(무변경)** → 하이퍼바이저가 **운영체제 아래**에서 메모리를 영리하게 가로채고 조율해야 함.\n\n---\n\n## 기본 구조 (메모리 가상화)\n\n* **machine 메모리(진짜 RAM)** vs **physical 메모리(게스트가 보는 가짜 물리)**\n\n  - ESX는 VM마다 **pmap(게스트 PPN→머신 MPN 변환표)** 를 두고, CPU가 실제로 쓰는 **shadow page table(가상→MPN)** 을 유지\n  - → 게스트의 평범한 메모리 접근은 **TLB 히트로 빠르게** 처리되면서, ESX는 뒤에서 **아무 페이지나 투명하게 다른 머신 프레임으로 재매핑**할 수 있음\n\n### 용어 사전\n* **하이퍼바이저/ VMM**: 여러 OS를 하드웨어 위에 안전하게 올리는 얇은 소프트웨어 층\n* **Ballooning**: 게스트 안 드라이버로 **게스트가 스스로** 덜 중요한 페이지를 내놓게 유도\n* **Demand paging(ESX)**: 풍선이 부족할 때 ESX가 **직접** 게스트 “물리” 페이지를 스왑\n* **Content-based sharing**: **내용 해시+전면 비교**로 **완전 동일** 페이지를 **COW 공유**\n* **Working-set sampling**: 일부 페이지만 **무작위 샘플**해서 **활동 비율** 추정\n* **Idle memory tax**: **유휴 페이지 단가를 높여** 먼저 회수하는 정책\n* **Hot I/O remapping**: **자주 DMA되는 페이지**를 **낮은 주소**로 재배치해 **복사 제거**\n* **PPN/MPN**: 게스트가 믿는 “물리” 페이지 번호 / 실제 머신 페이지 번호\n* **pmap**: PPN→MPN 테이블(각 VM 보유)\n* **shadow page table**: CPU가 소비하는 가상→MPN 매핑(ESX가 관리)\n* **COW(Copy-on-Write)**: 공유 페이지를 누가 쓰기 시작하면 그때 사본을 만들어 분리\n\n\n---\n\n## 메모리 회수 (과다할당에서 필수)\n\n### 1) **Ballooning** — 가장 선호되는 경로\n\n* 게스트 OS 안에 **풍선(balloon) 드라이버**를 넣고 ESX가 “**부풀려**라/**꺼뜨려**라”를 지시\n \n  - 풍선을 부풀리면 드라이버가 게스트 “물리” 페이지를 **할당·핀 고정** → 게스트 OS는 **자기 정책**으로 덜 중요한 페이지를 알아서 회수/스왑\n  - 드라이버는 **할당한 PPN 목록**을 ESX에 알려주고, ESX는 그 PPN을 받치던 **머신 프레임을 회수**\n\n* **장점**: “어떤 페이지가 덜 중요한가?” 를 **게스트 OS 스스로 판단**하므로 **정책 충돌**과 **이중 페이징(double paging)** 위험이 줄어듦\n* **안전성**: 풍선에 잡힌 PPN이 나중에 접근되면 ESX가 **함정 처리**해서 새 프레임을 붙이고(풍선 상태 리셋), **정합성** 유지\n\n#### Ballooning 흐름\n![](/julie/assets/cs/esx/01_ballooning.png)\n\n### 2) **Demand Paging** — 불가피할 때 쓰는 플랜 B\n\n* 풍선으로 부족하면 ESX가 **자체 스왑 영역**에 **게스트의 “물리” 페이지**를 **직접 페이징**\n* 게스트는 모름(메타 레벨 페이징)\n* 정책 충돌을 줄이려 **무작위성**을 섞음\n\n---\n\n## 중복 제거\n\n### **Content-based Page Sharing(내용기반 공유)**\n\n* **페이지 내용 해시**로 **서로 완전 동일한 페이지**를 찾아 **한 머신 프레임으로 공유 + COW**\n* 게스트 OS 코드 수정 없이, **언제/어디서/어떻게 만들어졌든** 내용이 같으면 공유\n  \n* **과정**:\n\n  1. 스캐너가 페이지를 **해시** → 전역 해시테이블 조회\n  2. **해시 충돌 후보** 나오면 **내용 전체 비교**로 진짜 확인\n  3. 같으면 **공유 + COW**, 중복 프레임 회수\n  4. 안 같으면 **힌트 기록**만(바로 COW로 두지 않아 **불필요한 COW fault 방지**)\n\n#### Page Sharing 흐름\n![](/julie/assets/cs/esx/02_page_sharing.png)\n\n---\n\n## Shares + Idle Memory Tax + 샘플링\n\n### 1) Share-based Allocation (비례 지분)\n\n* VM마다 **shares(지분)** 를 주고, 지분 비율에 맞게 **메모리 권리**(entitlement)를 배분\n* 과부하에서도 **비례적으로 저하**되고, 여유가 생기면 **비례적으로 이득**\n\n### 2) Idle Memory Tax (유휴 메모리 세금)\n\n* 문제: 지분만 보면 **유휴 VM이 메모리를 쌓아두고**, **활동 VM은 굶는** 일이 생김\n* 해결책\n  * **유휴 페이지에 더 높은 ‘가격’** 을 매겨 **먼저 회수**\n  * 즉, VM의 “가격”을 **shares / (활동 + (가중치)×유휴)** 로 보고, **가장 낮은 가격/페이지** VM에서 우선 회수 → **더 가치 있는(활동)** VM에 재배분\n  * 세율은 시스템 정책으로 조정; 갑작스런 작업세트 증가에 대비해 버퍼도 남김\n\n### 3) Working-set Sampling (작업세트 추정)\n\n* 게스트 OS를 전혀 수정하지 않고, 각 VM이 실제로 쓰는 메모리의 비율을 **임의로 추정**해 idle memory를 먼저 돌려받도록 도와주는 기법\n* 모든 페이지를 추적하면 정확하겠지만 비쌈. ESX는 **소수의 임의 페이지만 봐서 overhead를 고정/작게** 만듦\n* 추정 결과를 활동/유휴 페이지 수로 환산하고, 유휴 페이지는 더 비싸게 계산\n* 통계적 방법이라 **개별 순간엔 오차** 가능 → 평균/완충 정책(EWMA, Idle Tax, 히스테리시스)으로 흡수\n  * 빠른 평균(fast EWMA): 급증에 빨리 반응\n  * 느린 평균(slow EWMA): 감소에 천천히 반응(너무 성급한 회수 방지)\n  * 주기 중 즉시 반영본(current-fast): 주기 도중 급격한 증가도 놓치지 않게\n  * 최종 값은 세 가지 중 최댓값을 택해 증가엔 민첩/감소엔 보수적으로 만듦\n\n#### Idle-tax 의사결정 흐름\n![Idle-tax flow](/julie/assets/cs/esx/03_idle_tax.png)\n\n---\n\n## High-level 정책\n\n* **파라미터**\n  - min: VM이 어떤 상황에서도 최소한 보장받는 메모리 (회수 대상에서 최후에 빠짐)\n  - max: 게스트 OS가 \"내 물리 메모리\"라고 믿는 상한선. 여유가 많으면 보통 max 근처로 운용\n  - shares: 경쟁 상황에서 누가 더 많은 몫을 가져갈지 정하는 비례 지분. 메모리를 더 필요로 하는 VM들 사이에서 비율로 나눌 때 기준이 됨\n    - 단, ESX는 단순 비례 배분 대신 **“유휴 메모리 세금”** 을 얹어 안 쓰는 메모리를 먼저 돌려받도록 만듦\n    \n* **Admission control**\n  - RAM 쪽: 모든 VM의 min 합 + 관리 오버헤드를 충족할 머신 메모리가 있는가? → 없으면 부팅 거절 또는 관리자가 조정해야 함\n  - 스왑 쪽: 각 VM의 max − min 만큼 스왑 여유가 있는가? → 과다할당(Overcommit) 상태에서도 최악의 순간을 흡수할 공간. 실제로 항상 쓰진 않지만, 최소한의 안전판으로 예약\n    \n* **동적 재할당**\n    - 여유 충분: 아무 조치도 필요 없음\n    - 약간 부족: 부드러운 회수부터 시도\n    - 더 부족: 강한 회수 단계로 진입\n    - 매우 부족: 안전을 우선. 공격적 조치\n    - 이렇게 단계별로 나누는 이유는, 작은 출렁임에 과민 반응했다가 다시 되돌리고… 하는 플래핑 방지\n---\n\n## I/O 최적화: **Hot I/O Page Remapping**\n\u003e DMA(Direct Memory Access): 디바이스(예: NIC, 디스크 컨트롤러)가 CPU를 거치지 않고 메모리와 직접 데이터를 주고받는 방식\n\u003e * 장점: CPU 부담↓, 복사 횟수↓ → I/O가 더 빨라지고 시스템 전체 여유 증가\n\u003e * 전제: 디바이스가 해당 물리 메모리 주소에 직접 접근할 수 있어야 함. 일부 장치는 낮은 주소 범위만 접근 가능\n\n* 일부 DMA 장치는 **낮은 주소 영역**만 접근 가능 (하드웨어 IOMMU가 없을 수 있음). 그런데 VM 환경(ESX)에서는 게스트 페이지가 머신 메모리 곳곳에 흩어져 있음\n  \n  디바이스가 높은 주소를 못 읽으면, 보통 바운스 버퍼라는 낮은 주소 임시 버퍼에 한 번 복사한 뒤 DMA를 시킴\n  \n  **결과: 추가 복사 + 메모리 대역폭 낭비 + 지연 증가 → 성능 손해**\n  \n* ESX는 **자주 DMA되는 “핫” 페이지**를 감지하면 그 페이지를 **낮은 메모리로 재매핑**해서 **복사 없이** DMA가 가능하게 함\n\n  낮은 영역이 부족해지면 **차갑고 덜 쓰는 페이지**를 위로 올려 자리 확보\n\n#### Hot I/O Remapping\n![](/julie/assets/cs/esx/04_hot_io_remapping.png)\n\n---\n\n## 오해\n* **과다할당 = 스왑만 왕창**\n  \n  아님. 순서가 있음\n  - 1순위: 페이지 공유\n    \n    서로 내용이 같은 페이지를 하나로 합쳐서 메모리를 즉시 확보(COW).\n\n  - 2순위: 벌룬(ballooning)\n\n    게스트 OS 안의 드라이버가 스스로 덜 중요한 페이지를 내놓게 유도\n    → 어떤 페이지가 덜 중요한지는 게스트 OS가 가장 잘 알기 때문에, 성능 예측 가능\n\n  - 3순위: 스왑 (최후의 수단)\n    \n    위 두 가지로도 부족할 때만 게스트 “물리” 페이지를 ESX 스왑으로 내보냄\n  \n* **공유는 0페이지(모두 0인 페이지)만 된다**\n  \n  아님. 0페이지도 공유되지만 핵심은 코드·읽기전용(RO) 데이터\n  \n  - 같은 OS/라이브러리/런타임을 여러 VM이 쓰면, 코드·상수 데이터가 내용까지 동일한 경우가 많음\n  - ESX는 내용 해시 + 전체 비교로 정말 같은 페이지를 찾아 COW로 하나로 합쳐 메모리를 크게 줄임\n  - 누가 쓰기 시작하면 그때 사본을 만들어 분리되므로 안전\n\n* **Idle tax(유휴세금)가 보장(min)을 깨뜨린다**\n\n  아님. 최저 보장(min) 과 지분(shares) 는 그대로 지켜지고, 유휴로 추정되는 부분부터 우선 회수\n  \n  - ESX는 작업세트 샘플링으로 각 VM의 활동/유휴 비율을 대략 추정\n  - 메모리가 부족하면 유휴 페이지에 더 높은 ‘가격’을 매겨 먼저 회수하고, 활동 중인 VM에 재분배\n  - min 보장량은 유지되고, 갑자기 활동이 늘면 빠른 평균값을 써서 재빨리 메모리를 돌려줌\n\n--- \n\n## Review Questions\n\n### 1) VMware Workstation vs. VMware ESX Server: VM 안의 사용자 프로세스가 시스템콜을 할 때, 두 경우의 처리 경로\n\n#### 아키텍처 차이\n\n* **VMware Workstation (호스티드, *hosted*)**\n![](/julie/assets/cs/esx/05.png)\n  * 일반 **호스트 OS 위**에서 돌아가는 VMM(하이퍼바이저)\n  * 디바이스 드라이버·파일시스템 등 **장치는 호스트 OS**가 제공/관리\n  \n* **VMware ESX (베어메탈, *bare-metal*)**\n![](/julie/assets/cs/esx/06.png)\n  * **하드웨어 위에 직접** 올라가는 하이퍼바이저\n  * **자체 스택**으로 CPU·메모리·I/O를 **직접** 관리(장치도 직접 스케줄/제어)\n\n#### 시스템콜이 디스크 I/O로 이어지는 예\n* 공통점: **VM 안 사용자 프로세스** → **게스트 OS**(리눅스/윈도우)의 **시스템콜 처리** → 디스크 같은 장치 접근이 필요\n* 차이:\n  * **Workstation**: 게스트 OS의 “가상 디스크 읽기” 요청을 **VMM이 가로채**서, **호스트 OS의 `read()`** 등으로 대신 수행 → 데이터 받아 VM에 전달.\n   \n    ↳ **경로에 호스트 OS**가 껴 있으니, I/O 정책·오버헤드는 호스트에 의존.\n  * **ESX**: **하이퍼바이저가 하드웨어를 직접** 다룸\n    \n    가상 디스크 요청을 **바로 물리 디스크**에 매핑해 처리(백엔드가 도메인 형태로 분리되기도 함) → **높은 성능/정밀한 자원 통제** 가능\n\n\u003e 앱→게스트 OS까지는 동일. **차이는 “장치 접근을 누가 실제로 수행하느냐”** 에 있음: Workstation은 **호스트 OS**, ESX는 **하이퍼바이저(직접)**\n\n---\n\n### 2) 메모리 가상화: VMware vs. Xen\n![](/julie/assets/cs/esx/07.png)\n\n#### VMware ESX\n* **추가 번역 단계**: 게스트가 믿는 “물리” 페이지(가짜) → **머신 페이지(진짜)** 매핑을 **pmap**으로 관리\n* CPU가 쓰는 페이지테이블은 ESX가 유지하는 **그림자 페이지테이블(Shadow PT)**\n* 게스트가 PTE/TLB를 만지면 ESX가 **가로채서 shadow를 동기화**\n* **장점**: 게스트 수정 없이 **완전 가상화** 가능, 임의 페이지를 **투명하게 재배치/관찰** 가능\n* **비용**: Shadow 유지·동기화의 **복잡성/오버헤드**\n\n#### Xen\n\n* **게스트 PT를 직접 MMU에 등록**(게스트 OS는 **읽기 전용**으로 보고, **수정은 하이퍼콜**로 Xen에 요청)\n* Xen이 **검증**(자기 소유 페이지만 매핑, PT를 쓰기가능으로 만들지 않기 등) 후 반영\n* **배치**로 여러 변경을 **한 번에** 처리\n* 각 주소공간 상단의 **Xen 예약 영역**은 게스트가 건드릴 수 없음\n* **장점**: **Shadow PT 불필요** → 경로 단순/빠름(게스트는 약간 수정, 앱은 수정 없음)\n* **전제**: 게스트 OS가 **파라가상화**를 지원하도록 **소폭 수정**\n\n---\n\n### 3) 과다할당(Over-subscription) 시 메모리 회수 방법 + 각 방식의 장단점\n![](/julie/assets/cs/esx/08.png)\n\n\n#### (1) **Ballooning** *(권장 경로)*\n![](/julie/assets/cs/esx/09.png)\n\n* 게스트 안에 **작은 “풍선” 드라이버** 존재. ESX가 “부풀려라”라고 하면 드라이버가 게스트 “물리” 페이지를 **할당·핀 고정**해 게스트에 **메모리 압박**을 줌.\n* 그러면 **게스트 OS 자신**의 페이지 교체 정책으로 **덜 중요한 페이지**를 내보냄(필요시 **게스트 스왑**으로)\n* **장점**: 성능/행동이 “메모리를 적게 장착했을 때”와 **유사** → **예측 가능**, **이중 페이징 위험↓**\n* **단점**: 드라이버가 **없거나 비활성/느릴 때**는 회수가 더딜 수 있음\n\n#### (2) **VMM Demand Paging(스왑)** *(차선책)*\n\n* ESX가 **게스트 모르게** 게스트 “물리” 페이지를 **ESX 스왑 영역**으로 내보냄\n* **장점**: **게스트 협조 없이도** 당장 회수 가능\n* **단점**: **이중 페이징** 위험(게스트도 같은 데이터 스왑), VMM은 페이지 가치 정보를 **잘 모름** → 비효율 가능\n\n#### (3) **내용 기반 페이지 공유(Content-based Sharing)** *(상시 압박 완화)*\n![](/julie/assets/cs/esx/10.png)\n* 여러 VM에 **내용이 완전히 같은 페이지**가 있으면 **한 프레임으로 공유 + COW**\n* **장점**: 게스트 수정 없이 **메모리 발자국** 크게 줄일 수 있음, CPU 부담 낮게 운영 가능\n* **주의**: 회수 **트리거**라기보다 **배경 최적화**(다른 회수와 **함께** 효과↑)\n\n---\n\n### 4) Xen에서의 Ballooning\n![](/julie/assets/cs/esx/11.png)\n* Xen은 VM(도메인)마다 **메모리 “예약량”** 을 갖고, **게스트 풍선 드라이버**를 통해 **반납/재요청**을 하게 함\n* 관리 정책에 따라 특정 도메인의 예약을 **줄이거나 늘리고**, 게스트는 그만큼 **페이지를 Xen에 돌려주거나 받아감**\n* **격리 보장 유지**(예약선 유지) + **동적 재분배**(여유가치 높은 곳에 메모리 이동)\n\n---\n\n### 5) VMware의 페이지 공유\n\n* ESX가 주기적으로 페이지 **내용 해시** → 후보가 보이면 **전체 비교**로 진짜 동일 확인 → **같으면 공유 + COW**\n* **게스트 변경 불필요**. 이후 누군가 해당 페이지에 **쓰기** 하면 **그때** 개인 사본 생성\n\n---\n\n### 6) VMware의 메모리 **할당 정책**\n![](/julie/assets/cs/esx/12.png)\n\n* **목표**: **효율**(RAM 낭비 최소)과 **격리**(VM 간 공정)를 **동시에**\n* **기본 파라미터**: 각 VM의 **최소 보장(min)**, **최대 크기(max)**, **지분(shares)**\n* **비례 지분 + 최소 자금(min-funding) 회수**: “**할당 페이지당 지분이 낮은** VM”에서 먼저 회수 → **가치 높은 VM**에 재배치\n* **Idle Memory Tax(유휴 메모리 세금)** + **작업세트 샘플링**:\n\n  * 단순 지분만 쓰면 **노는 VM이 메모리 독점** → **유휴 페이지에 더 높은 ‘가격’** 을 매겨 **먼저 회수**\n  * 게스트를 건드리지 않고 **일부 페이지만 샘플링**해 **활동/유휴 비율** 추정(증가엔 빠르게, 감소엔 천천히 반응)\n* **시스템 상태 기반 트리거**:\n\n  * 여유 충분: 조치 없음 → **공유**로 발자국 감소\n  * 약간 부족: **Ballooning 우선**\n  * 더 부족: **페이징 가동**\n  * 매우 부족: **페이징 지속 + 목표 초과 VM 제약**\n  * 목표: 여유 메모리를 **안정 구간**으로 되돌리기(출렁임 방지 로직 포함)\n"])</script><script>self.__next_f.push([1,"b:[\"slug\",\"cs/esx\",\"c\"]\n13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"MYUr5GWbJ_KukmkXSD4o1\",\"assetPrefix\":\"/julie\",\"urlParts\":[\"\",\"blog\",\"cs\",\"esx\",\"\"],\"initialTree\":[\"\",{\"children\":[\"blog\",{\"children\":[[\"slug\",\"cs/esx\",\"c\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":[\\\"cs\\\",\\\"esx\\\"]}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"blog\",{\"children\":[[\"slug\",\"cs/esx\",\"c\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[\"$\",\"$6\",null,{\"fallback\
